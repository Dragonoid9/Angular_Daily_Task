<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text and Typography Example</title>
    <style>
      body {
        font-family: "Arial", sans-serif;
        background-color: #f4f4f4;
        color: #333;
      }

      h1 {
        font-size: 36px;
        font-weight: bold;
        text-align: center;
        text-transform: uppercase;
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
      }

      p {
        font-size: 16px;
        line-height: 1.6;
        letter-spacing: 1px;
        text-align: justify;
        text-indent: 30px;
        color: #555;
      }

      .highlight {
        background-color: yellow;
        font-style: italic;
        padding: 0 5px;
      }
    </style>
  </head>
  <body>
    <h1>Typography in CSS</h1>
    <p>
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
      <span class="highlight">Nullam et feugiat justo.</span> Cras ultricies,
      est eu volutpat condimentum, turpis lorem facilisis ante, a malesuada
      lectus metus ac metus.
    </p>
  </body>
</html>
