<div>
  <h1>Pipelines:Date</h1>
  <p>{{ today }}</p>
  <p>{{ today | date }}</p>
  <p>{{ today | date : "shortDate" }}</p>
  <p>{{ today | date : "MMddyyyy" }}</p>
  <p>{{ today | date : "YYYY:MM:dd" }}</p>
  <p>{{ today | date : "YYYY/MM/dd" }}</p>
</div>
<div>
  <h1>Text manipulation:Pipelines</h1>
  <p>{{ text }}</p>
  <p>Uppercase : {{ text | uppercase }}</p>
  <p>Lowercase : {{ text | lowercase }}</p>
</div>
