<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Microlayout</title>
    <style>
      /* Base Styles */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
      }

      h2,
      h3 {
        font-size: 1.5rem;
        margin-bottom: 1rem;
      }

      /* Container Styles */
      .container {
        max-width: 600px;
        margin: 2rem auto;
        background-color: white;
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
      }

      /* Form Styles */
      .form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      label {
        font-size: 1rem;
        color: #333;
      }

      input {
        padding: 0.8rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }

      input:focus {
        border-color: #007bff;
        outline: none;
      }

      button {
        padding: 0.8rem 1.2rem;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #0056b3;
      }

      /* Card Styles */
      .card {
        margin-top: 2rem;
        padding: 1rem;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .card h3 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }

      .card p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
      }

      /* Responsive Styles */

      /* Tablets and below (768px and below) */
      @media (max-width: 768px) {
        .container {
          padding: 1rem;
        }

        h2 {
          font-size: 1.2rem;
        }

        .form {
          gap: 0.8rem;
        }

        input,
        button {
          font-size: 0.9rem;
          padding: 0.7rem;
        }

        .card h3 {
          font-size: 1.1rem;
        }
      }

      /* Mobile (480px and below) */
      @media (max-width: 480px) {
        .container {
          margin: 1rem;
          padding: 1rem;
        }

        h2 {
          font-size: 1rem;
        }

        .form input,
        .form button {
          padding: 0.6rem;
          font-size: 0.9rem;
        }

        .card {
          padding: 0.8rem;
        }

        .card h3 {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <section class="container">
      <h2>Microlayout</h2>

      <form class="form">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name" />

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" />

        <button type="submit" class="btn">Submit</button>
      </form>

      <div class="card">
        <h3>Card Title</h3>
        <p>This is a simple card layout that adjusts based on screen size.</p>
        <button class="btn">Learn More</button>
      </div>
    </section>
  </body>
</html>
