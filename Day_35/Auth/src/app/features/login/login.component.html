<div>
  <form (submit)="login(); $event.preventDefault()">
    <input
      [(ngModel)]="username"
      name="username"
      placeholder="Username"
      required
    />
    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Password"
      required
    />
    <button type="submit">Login</button>
    <p *ngIf="error" class="error-message">{{ error }}</p>
  </form>
</div>
