<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Mostly used pragma directive is refresh -->
     <meta http-equiv="refresh" content="60">
     <!-- content-security-policy pragma directive enables a defining a content policy for the current document. Content policies mostly specify allowed server origins and script endpoints which help gaurd against cross-site scripting attacks.  -->
     <meta http-equiv="content-security-policy" content="default-src https:" />
     <meta name="description" content="Website description for the Search Engine to understand it." />
     <meta name="robots" content="noindex, nofollow" />
     <!-- No follow no index makes the SE to not index the site.-->

     <!-- OpenGraph :Open Graph and similar meta tag protocols can be used to control how social media sites, like Twitter, LinkedIn, and Facebook, display links to your content.  -->
     <!-- When you post a link of the website on Facebook or Twitter, a card with an image, site title, and site description appears. The entire card is a hyperlink to the URL you provided. -->
     <meta property="og:title" content="Machine Learning Workshop" />
     <meta property="og:description" content="School for Machines Who Can't Learn Good and Want to Do Other Stuff Good Too" />
     <meta property="og:image" content="http://www.machinelearningworkshop.com/image/all.png" />
     <meta property="og:image:alt" content="Black and white line drawing of refrigerator, french door refrigerator, range, washer, fan, microwave, vaccuum, space heater and air conditioner" />

     <!--If someone bookmarks your site, adding it to their home screen, or if your site is a progressive web application or otherwise works offline or without browser chrome features displayed, you can provide application icons for the mobile device's home screen.  -->
     <link rel="apple-touch-startup-image" href="icons/ios-portrait.png" media="orientation: portrait" />
<link rel="apple-touch-startup-image" href="icons/ios-landscape.png" media="orientation: landscape" />
    <title>MetaData`</title>
</head>
<body>
    This is for the basic of the Metadata in the HTML generally used for the information of the Data. SEO utilizes this one.
</body>
</html>
