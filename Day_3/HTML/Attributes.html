<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute</title>
</head>
<body>
    <!-- href and target are attributes of the <a> tag and target=blank will take to another tab in browser. -->
    <a href="https://www.google.com" target="_blank" >Google</a>
    <div class="test1">
        This is inside the test1 class div.
    </div>
    <div id="test0">
        This is inside the test0 class div.
    </div>
</body>
</html>
